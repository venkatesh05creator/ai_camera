[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owner-only-ai-camera-assistant"
version = "1.0.0"
description = "Privacy-first, owner-verification camera assistant with a hardened FastAPI backend."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.156,<1.0",
    "starlette>=1.9,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.16,<3.0",
    "SQLAlchemy>=2.0.30,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "cryptography>=50.0.2,<51.0",
    "Jinja2>=3.1,<4.0",
    "python-multipart>=0.0.31,<1.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
vision = ["numpy>=2.1,<3.0", "opencv-python-headless>=4.10,<5.0", "tensorflow>=2.20,<3.0"]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[tool.setuptools]
packages = ["ownerai", "ownerai.routers", "ownerai.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [
    ".venv",
    "data",
    "models",
    "datastore",
    "inputs",
    "node_modules",
    "load_test",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "C4", "I"]
ignore = [
    "E501",   # line length is handled by the formatter
    "S101",   # asserts are fine in the test-suite
    "B008",   # FastAPI dependencies are call expressions by design
    "S105",   # "password" style names are used for detection, not secrets
    "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S311", "E402"]
"ownerai/routers/legacy.py" = ["S404", "S603"]
"app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["ownerai"]

[tool.coverage.run]
source = ["ownerai"]
omit = ["ownerai/routers/legacy.py"]
