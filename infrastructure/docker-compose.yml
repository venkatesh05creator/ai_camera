version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database - Primary relational storage for entities & audit logs
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: surveillance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: surveillance
      POSTGRES_USER: surveillance_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-surveillance_secure_pwd_9988}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveillance_user -d surveillance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis - High-throughput temporary cache and event pub/sub queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: surveillance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Surveillance Backend & Local AI Worker Plane
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: surveillance-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://surveillance_user:${DB_PASSWORD:-surveillance_secure_pwd_9988}@db:5432/surveillance
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-generate_secure_random_production_secret_key_12345}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      MEDIA_STORAGE_PATH: /app/var/media
      SNAPSHOT_STORAGE_PATH: /app/var/snapshots
      PORT: 8000
    volumes:
      - media_storage:/app/var/media
      - snapshot_storage:/app/var/snapshots
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Web Dashboard Gateway - Serves React TS frontend & reverse proxies APIs
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: surveillance-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
  media_storage:
  snapshot_storage:
