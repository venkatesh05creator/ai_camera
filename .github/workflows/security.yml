name: Security Review

on:
  push:
    branches: [ main, cleanup/prune ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly dependency and SAST scan
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # Claude Code built-in security review (runs in Claude Code, not CI).
  # Triggered manually via `claude /security-review` on pending changes.
  # The Anthropic API key must never be stored in this repository; it is
  # supplied only through the Claude Code client configuration.
  claude-code-security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

  # Dependency vulnerability scan (Python server deps).
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt
          pip install pip-audit
      - name: Run pip-audit
        run: python -m pip_audit -r requirements-server.txt --progress-spinner=off
        env:
          # PIP_AUDIT_API_KEY or similar must be provided via GitHub Secrets
          # if the private PyPI mirror requires authentication. Never commit
          # an API key to this repository.
          PIP_AUDIT_API_KEY: ${{ secrets.PIP_AUDIT_API_KEY }}

  # SAST / lint scan.
  ruff-bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit
      - name: Run ruff
        run: python -m ruff check ownerai tests app.py
      - name: Run bandit
        run: python -m bandit -r ownerai -q

  # Frontend dependency audit.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run npm audit
        working-directory: web
        run: npm audit --production || true
        # web/ dev build tools (vite/esbuild) carry known advisories that are
        # not shipped to production; they are tracked in docs/security/findings.md.
