{% extends "base.html" %}
{% block title %}Choose a new password - {{ app_name }}{% endblock %}

{% block content %}
<section class="card">
  <h1>Choose a new password</h1>
  <form class="stack" data-reset-form novalidate>
    <input type="hidden" name="token" value="{{ token }}">
    <div class="field">
      <label for="reset-password">New password</label>
      <input id="reset-password" name="password" type="password" autocomplete="new-password"
             required minlength="12" maxlength="256">
      <span class="hint">At least 12 characters with upper and lower case letters, a digit and a symbol.</span>
    </div>
    <p class="alert alert-error" data-reset-error role="alert" hidden></p>
    <p class="alert" data-reset-status role="status" hidden></p>
    <button class="button button-block" type="submit" data-reset-submit>Save the new password</button>
  </form>
  <p class="small muted"><a href="/login">Back to sign in</a></p>
</section>
{% endblock %}
