{% extends "base.html" %}
{% block title %}Reset your password - {{ app_name }}{% endblock %}

{% block content %}
<section class="card">
  <h1>Reset your password</h1>
  <p class="muted">We send a single-use link to the address of your account.</p>
  <form class="stack" data-forgot-form novalidate>
    <div class="field">
      <label for="forgot-email">E-mail address</label>
      <input id="forgot-email" name="email" type="email" autocomplete="username" required maxlength="320">
    </div>
    <p class="alert alert-error" data-forgot-error role="alert" hidden></p>
    <p class="alert" data-forgot-status role="status" hidden></p>
    <button class="button button-block" type="submit" data-forgot-submit>Send reset link</button>
  </form>
  <p class="small muted"><a href="/login">Back to sign in</a></p>
</section>
{% endblock %}
